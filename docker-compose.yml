services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: orbe
      POSTGRES_USER: orbe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no arquivo .env}
    volumes:
      - orbe-postgres:/var/lib/postgresql/data
      - ./server/src/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbe -d orbe"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [orbe-internal]

  api:
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://orbe:${POSTGRES_PASSWORD}@postgres:5432/orbe
      JWT_SECRET: ${JWT_SECRET:?defina no arquivo .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      UPLOAD_DIR: /data/uploads
      DATABASE_SSL: "false"
    volumes:
      - orbe-uploads:/data/uploads
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [orbe-internal]

volumes:
  orbe-postgres:
  orbe-uploads:
networks:
  orbe-internal:
